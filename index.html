<!doctype html><html lang="zh-HK"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#1f2937" /><title>多合一搜尋引擎</title><style>  *,*::before,*::after{box-sizing:border-box}  html,body{margin:0;padding:0}  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}  :root{color-scheme:light dark}  [data-theme="dark"]{--bg-grad:linear-gradient(135deg,#1f2937 0%,#2c3e50 50%,#1e293b 100%);--fg:#e5e7eb;--muted:#94a3b8;--muted-2:#cbd5e1;--card:rgba(255,255,255,0.05);--card-border:rgba(255,255,255,0.1);--card-border-hover:rgba(255,255,255,0.2);--input-bg:#ffffff;--input-fg:#1f2937;--input-border:rgba(255,255,255,0.1);--chip-bg:rgba(255,255,255,0.05);--chip-bg-hover:rgba(255,255,255,0.10);--chip-border:rgba(255,255,255,0.15);--chip-fg:#e2e8f0;--header-fg:#ffffff;--sub-fg:#cbd5e1;--toggle-bg:rgba(255,255,255,0.10);--toggle-border:rgba(255,255,255,0.15);--toggle-fg:#e2e8f0;--clear-bg:#e2e8f0;--clear-fg:#334155;--shadow-card:0 10px 25px -5px rgba(0,0,0,0.25);--shadow-input:0 20px 25px -5px rgba(0,0,0,0.20);--focus-offset:#1e293b}  [data-theme="light"]{--bg-grad:linear-gradient(135deg,#f1f5f9 0%,#ffffff 50%,#e2e8f0 100%);--fg:#0f172a;--muted:#64748b;--muted-2:#475569;--card:rgba(255,255,255,0.85);--card-border:#e2e8f0;--card-border-hover:#cbd5e1;--input-bg:#ffffff;--input-fg:#0f172a;--input-border:#e2e8f0;--chip-bg:#ffffff;--chip-bg-hover:#f8fafc;--chip-border:#e2e8f0;--chip-fg:#334155;--header-fg:#1e293b;--sub-fg:#64748b;--toggle-bg:#ffffff;--toggle-border:#e2e8f0;--toggle-fg:#334155;--clear-bg:#f1f5f9;--clear-fg:#475569;--shadow-card:0 10px 25px -5px rgba(15,23,42,0.10);--shadow-input:0 20px 25px -5px rgba(15,23,42,0.10);--focus-offset:#ffffff}  body{background:var(--bg-grad);color:var(--fg);min-height:100vh;padding:40px 16px 64px;transition:background .3s,color .3s}  .wrap{max-width:768px;margin:0 auto}  .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}  .toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9999px;font-size:12px;font-weight:500;border:1px solid var(--toggle-border);background:var(--toggle-bg);color:var(--toggle-fg);cursor:pointer;transition:all .15s;font-family:inherit}  .toggle:hover{transform:translateY(-1px)}  .toggle:focus{outline:none;box-shadow:0 0 0 2px var(--focus-offset),0 0 0 4px #38bdf8}  .home-link{text-decoration:none;font-weight:600;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(56,189,248,0.25)}  .home-link:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(56,189,248,0.35);background:linear-gradient(135deg,#0ea5e9,#4f46e5)}  .home-link:active{transform:translateY(0)}  .toggle:active{transform:translateY(0)}  header{text-align:center;margin-bottom:40px}  h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600;letter-spacing:-0.01em;color:var(--header-fg);margin:0}  .sub{margin-top:8px;font-size:14px;color:var(--sub-fg)}  .search-wrap{position:sticky;top:16px;z-index:10;margin-bottom:16px}  .input-box{position:relative}  input[type="text"]{width:100%;padding:16px 48px 16px 20px;font-size:16px;border-radius:16px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--input-fg);box-shadow:var(--shadow-input);font-family:inherit;transition:all .15s}  input[type="text"]::placeholder{color:#94a3b8}  input[type="text"]:focus{outline:none;border-color:transparent;box-shadow:var(--shadow-input),0 0 0 3px #38bdf8}  .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:none;align-items:center;justify-content:center;border-radius:9999px;background:var(--clear-bg);color:var(--clear-fg);border:none;cursor:pointer;font-size:14px;transition:all .15s;font-family:inh olor:var(--muted)}  .quicklinks{margin-top:-16px}  .quicklink{text-decoration:none}  @media (max-width:480px){body{padding:24px 12px 48px}.btn{padding:9px 14px;font-size:13px}h1{font-size:1.5rem}}</style></head><body data-theme="dark">  <div class="wrap">    <div class="top-row">      <a id="homeLink" class="toggle home-link" href="https://terry20250224.github.io/my-share/links.html" target="_blank" rel="noopener noreferrer" aria-label="返回常用連結導航">        <span aria-hidden="true">🏡</span>        <span>常用連結導航</span>      </a>

  function applyTheme(t){    document.body.setAttribute('data-theme', t);    themeIcon.textContent = t === 'dark' ? '🌙' : '☀️';    themeLabel.textContent = t === 'dark' ? '深色模式' : '淺色模式';    try { localStorage.setItem('theme', t); } catch(e){}  }  function currentTheme(){    try {      var s = localStorage.getItem('theme');      if (s === 'dark' || s === 'light') return s;    } catch(e){}    return 'dark';  }  applyTheme(currentTheme());  themeToggle.addEventListener('click', function(){    applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');  });

  function syncClearVisibility(){    if (input.value) inputBox.classList.add('has-text');    else inputBox.classList.remove('has-text');  }  input.addEventListener('input', syncClearVisibility);  input.addEventListener('keydown', function(e){    if (e.key === 'Enter'){ e.preventDefault(); openSearch(DEFAULT_URL); }  });  clearBtn.addEventListener('click', function(){    input.value = '';    syncClearVisibility();    input.focus();  });
